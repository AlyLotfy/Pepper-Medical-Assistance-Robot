<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Face Login - Pepper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f7f4f0; display: -webkit-flex; display: flex;
           align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border-radius: 24px; padding: 30px; width: 90%; max-width: 460px;
            box-shadow: 0 10px 30px rgba(184,154,108,0.15); text-align: center; }
    h1 { color: #5a4a3b; margin-bottom: 6px; }
    p  { color: #8a7b6b; font-size: 14px; margin-bottom: 20px; }
    #video-container { position: relative; border-radius: 16px; overflow: hidden;
                       background: #222; margin-bottom: 16px; }
    #video { width: 100%; border-radius: 16px; display: block; background: #222; aspect-ratio: 4/3; object-fit: cover; }
    .overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
               width: 200px; height: 200px; border: 3px solid #b89a6c;
               border-radius: 50%; pointer-events: none; }
    .btn { width: 100%; padding: 15px; border: none; border-radius: 12px;
           background: #b89a6c; color: white; font-size: 18px; font-weight: bold;
           cursor: pointer; margin-top: 10px; }
    .btn:disabled { background: #ccc; }
    .btn-secondary { background: #e0e0e0; color: #5a4a3b; font-size: 15px; padding: 12px; margin-top: 8px; }
    .status { margin-top: 14px; font-size: 14px; min-height: 40px; }
    .status.success { color: #2d6a2d; font-weight: bold; }
    .status.error   { color: #d9534f; }
    .status.info    { color: #5a4a3b; }
    canvas { display: none; }
    .back-link { display: block; margin-top: 16px; color: #b89a6c; font-size: 14px; cursor: pointer; }
  </style>
  <script>
  /* INLINE boot guard — must not depend on any network fetch. */
  (function(){
    var K="pg_"+(location.pathname||"/");
    function tried(){try{return sessionStorage.getItem(K)==="1";}catch(e){return false;}}
    function mark(){try{sessionStorage.setItem(K,"1");}catch(e){}}
    function clr(){try{sessionStorage.removeItem(K);}catch(e){}}
    function recover(){if(tried())return false;mark();var u=location.href.split("#")[0];u+=(u.indexOf("?")>=0?"&":"?")+"_bg="+(+new Date());try{location.replace(u);}catch(e){location.href=u;}return true;}
    window.__pepperRecover=recover;
    window.onerror=function(m,s,l){try{var d=document.getElementById("debug-box");if(d){d.style.display="block";d.innerHTML+="ERR: "+m+" @"+l+"<br>";}}catch(e){}recover();return false;};
    if(window.addEventListener)window.addEventListener("unhandledrejection",function(){recover();},false);
    function blank(){var b=document.body;if(!b)return true;var k=b.children;if(!k||!k.length)return true;for(var i=0;i<k.length;i++){if(k[i].offsetHeight&&k[i].offsetHeight>0)return false;}return true;}
    function chk(){if(blank())recover();else clr();}
    function ready(f){if(document.readyState==="complete"||document.readyState==="interactive"){setTimeout(f,0);}else if(window.addEventListener){window.addEventListener("DOMContentLoaded",f,false);}else{var t=setInterval(function(){if(document.body){clearInterval(t);f();}},50);}}
    ready(function(){setTimeout(chk,1500);});
    if(document.addEventListener)document.addEventListener("click",function(e){var a=e.target;while(a&&a.nodeName!=="A")a=a.parentNode;if(!a||!a.getAttribute)return;var h=a.getAttribute("href");if(!h)return;var lo=h.toLowerCase();if(h.charAt(0)==="#"||h.charAt(0)==="/"||lo.indexOf("javascript:")===0||lo.indexOf("mailto:")===0||lo.indexOf("tel:")===0||lo.indexOf("http")===0)return;if(lo.indexOf(".html")!==-1&&h.indexOf("_t=")===-1){a.setAttribute("href",h+(h.indexOf("?")>=0?"&":"?")+"_t="+(+new Date()));}},true);
  })();
  </script>
</head>
<body>
<div class="card">
  <h1>Face Login</h1>
  <p>Look at the camera and click the button below</p>

  <div id="video-container">
    <img id="video" alt="Pepper camera">
    <div class="overlay"></div>
  </div>

  <button class="btn" id="captureBtn" onclick="capture()">Scan My Face</button>
  <button class="btn btn-secondary" onclick="window.location.href='login.html'">&#8592; Back to Login</button>

  <div class="status info" id="status">Starting camera...</div>
</div>

<script src="demo_store.js"></script>
<script>
  var video  = document.getElementById('video');
  var status = document.getElementById('status');
  var btn    = document.getElementById('captureBtn');

  // Persistent MJPEG stream: browser renders multipart/x-mixed-replace
  // natively, so we get smooth video without JS polling.
  function startStream() {
    status.textContent = 'Connecting to Pepper camera...';
    video.onload  = function() {
      status.textContent = 'Camera ready. Position your face in the circle.';
      status.className   = 'status info';
    };
    video.onerror = function() {
      status.className  = 'status error';
      status.textContent = 'Camera unavailable. Retrying...';
      // Retry after short delay — cache-bust the URL so the browser
      // actually re-opens the stream instead of reusing a dead socket.
      setTimeout(function() {
        video.src = '/api/camera/mjpeg?t=' + Date.now();
      }, 1500);
    };
    video.src = '/api/camera/mjpeg?t=' + Date.now();
  }
  startStream();

  function stopStream() {
    // Close the persistent MJPEG socket so the Flask worker is released.
    video.src = '';
    video.removeAttribute('src');
  }

  function capture() {
    btn.disabled = true;
    status.className = 'status info';
    status.textContent = 'Scanning face...';

    // Grab a fresh frame as base64 from the server
    var xhr2 = new XMLHttpRequest();
    xhr2.open('GET', '/api/camera/snapshot_b64', true);
    xhr2.timeout = 10000;
    xhr2.onreadystatechange = function() {
      if (xhr2.readyState !== 4) return;
      try {
        var snap = JSON.parse(xhr2.responseText);
        if (snap.error) {
          status.className = 'status error';
          status.textContent = 'Camera error: ' + snap.error;
          btn.disabled = false;
          return;
        }
        var imageData = snap.data_url;
        sendFaceLogin(imageData);
      } catch(e) {
        status.className = 'status error';
        status.textContent = 'Camera error. Try again.';
        btn.disabled = false;
      }
    };
    xhr2.send();
  }

  function sendFaceLogin(imageData) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/face_login', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 15000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      btn.disabled = false;
      try {
        var data = JSON.parse(xhr.responseText);
        if (data.success) {
          stopStream();
          status.className = 'status success';
          status.textContent = 'Welcome, ' + data.name + '! Logging you in...';
          if (window.STORE && STORE.loginByName) {
            STORE.loginByName(data.name);
          }
          setTimeout(function() { window.location.href = '/'; }, 1200);
        } else {
          status.className = 'status error';
          status.textContent = data.error || 'Face not recognized. Please try again.';
        }
      } catch(e) {
        status.className = 'status error';
        status.textContent = 'Server error. Try again.';
      }
    };
    xhr.ontimeout = function() {
      btn.disabled = false;
      status.className = 'status error';
      status.textContent = 'Request timed out. Please try again.';
    };
    xhr.send(JSON.stringify({image: imageData}));
  }
</script>
</body>
</html>
